name: Website, readme, or tooling
description: Bugs or improvements for the GitHub Pages site, generated markdown, scripts, or CI
title: "[Site/docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        For problems with the **live directory**, **readme**, **docs/development.md**, search-queries page, or build tooling.

        **Contributing content?** Edit **`_data/`** YAML (e.g. **`queries.yaml`** for job boards), then run **`just readme`** / **`just generate`** — do not hand-edit generated **`docs/*.md`** only. See [contributing.md](https://github.com/leftkats/greek-software-ecosystem/blob/main/contributing.md#repository-rules-read-this-first).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Live site (GitHub Pages / index.html)
        - Readme or generated markdown
        - Podcasts (`_data/podcasts.yaml` / `docs/greek-tech-podcasts.md` / podcasts.html)
        - Python scripts / `just` recipes
        - GitHub Actions / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened or what would you like?
      description: Steps to reproduce for bugs; clear idea for enhancements.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Browser, OS, or `just` / Python versions if relevant.
