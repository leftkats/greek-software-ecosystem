# Laptop-friendly cafés, workspace directories, and remote hubs for Greece.
# Feeds workspaces.html (searchable table) and docs/remote-cafe-resources.md (run `just generate`).
#
# Entry kinds:
#   directory  — a site or article that lists/maps many laptop-friendly places
#   cafe       — a single coffee shop or venue
#   remote_hub — coworking, coliving, or dedicated remote-work space
#
# Required: kind, title, url
# Recommended: location (city/area), description (markdown)
# Optional: lat, lng (decimal degrees — powers the Workspaces map), google_maps_url,
#           tags (list of short labels), details (key → value table), note (markdown)
#
# Coordinates: right-click a place in Google Maps → copy latitude/longitude, or use a
# Share link that contains @lat,lng (we parse those automatically when lat/lng are omitted).
#
# --- Add a place from your Google Maps saved list ---
# 1. Open Google Maps → Saved → pick your list (or open a place directly).
# 2. Open the place → Share → Copy link (https://maps.google.com/... or https://maps.app.goo.gl/...).
# 3. Add a new list item under `entries:` below (see commented examples).
# 4. Open a pull request — see contributing.md on GitHub.
#
# Example café (uncomment and edit to submit):
#
#   - kind: cafe
#     title: Example Laptop Café
#     url: https://example.com/venue
#     google_maps_url: https://maps.app.goo.gl/example
#     lat: 37.9838
#     lng: 23.7275
#     location: Athens, Exarchia
#     tags: [wifi, power, quiet]
#     description: |
#       Strong Wi‑Fi, plenty of outlets, laptop-friendly until late afternoon.
#
# Example remote hub:
#
#   - kind: remote_hub
#     title: Example Coworking Space
#     url: https://example.com/cowork
#     google_maps_url: https://maps.app.goo.gl/example
#     location: Thessaloniki
#     tags: [coworking, meeting-rooms, day-pass]
#     description: |
#       Day passes and monthly desks; book online.

intro: |
  **Laptop-friendly cafés**, workspace finders, and **remote hubs** across Greece—curated for people who work away from a traditional office. Use the **table** or **map** view below (map pins need `lat`/`lng` in the YAML).

disclaimer: |
  **Disclaimer:** This list is community-maintained. Hours, Wi‑Fi quality, and laptop policies change—confirm with the venue before visiting.

entries:
  - kind: directory
    title: Remote Work Café
    url: https://remotework.cafe/
    location: Global (Greece listings included)
    tags: [directory, filters, reviews]
    description: |
      [**Remote Work Café**](https://remotework.cafe/) is a community-powered guide to **work-friendly cafés** worldwide: explore by location or **near you**, filter by quiet, meals, Wi‑Fi, natural light, outdoor seating, and accessibility, and read short reviews from other remote workers.
    details:
      Site: https://remotework.cafe/
    note: |
      Greek examples appear among global listings (e.g. **Thessaloniki**, **Cyclades**); use the site’s search and filters for your area.

  - kind: cafe
    title: Sync
    url: https://www.instagram.com/sync.ath/
    google_maps_url: https://www.google.com/maps/search/?api=1&query=Sync+Vissis+25+Athens
    lat: 37.978533
    lng: 23.727368
    location: Athens, Monastiraki (Psiri)
    tags: [wifi, power, all-day, brunch, coffee]
    description: |
      All-day **restaurant and coffee spot** on Vissis 25 (former Dope site): specialty coffee (Qahwa), brunch, and an upper **mezzanine suited for laptop work** with natural light. Evenings shift to dining and cocktails—confirm laptop policy if you stay late.

